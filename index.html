  <!-- ===== 顶部 HUD ===== -->
  <header class="hud" id="hud">
    <div class="hud-row hud-row--top">
      <div class="hud-realm" id="hud-realm">练气 1层</div>
      <div class="hud-top-right">
        <span class="hud-pill" id="hud-pill-boost" hidden>丹药加持</span>
        <span class="res weather-res" id="weather-display" title="天时"><svg class="ico" id="weather-ico"><use href="#i-sun"/></svg><b id="weather-time">12:00</b></span>
      </div>
    </div>
    <div class="hud-row hud-row--bar">
      <div class="cultivation-bar-wrap">
        <div class="cultivation-bar" id="cultivation-bar">
          <div class="cultivation-fill" id="cultivation-fill"></div>
        </div>
        <span class="cultivation-text" id="cultivation-text">0 / 100</span>
      </div>
      <button class="btn-breakthrough" id="btn-breakthrough" data-action="breakthrough" hidden>突破</button>
    </div>
    <div class="hud-resources">
      <span class="res" title="灵石"><svg class="ico ico--stone"><use href="#i-stone"/></svg><b id="res-stone">50</b></span>
      <span class="res" title="灵草"><svg class="ico ico--herb"><use href="#i-herb"/></svg><b id="res-herb">10</b></span>
      <span class="res" title="矿石"><svg class="ico ico--ore"><use href="#i-ore"/></svg><b id="res-ore">0</b></span>
      <span class="res" title="凝露"><svg class="ico ico--dew"><use href="#i-dew"/></svg><b id="res-dew">0</b></span>
      <span class="res res--pill" title="丹药 · 聚气 / 破障"><svg class="ico ico--pill"><use href="#i-pill"/></svg><b id="res-pill">0</b><span class="res-split">·</span><b class="res-second" id="res-pill-po">0</b></span>
    </div>
  </header>

  <!-- ===== 主内容区 ===== -->
  <main class="main-content" id="main-content">

    <!-- 小院场景（2D 俯视 · 可切换山峰） -->
    <section class="yard-scene scene-topdown" id="yard-scene" data-peak="qingyun">

      <!-- 山峰选择 -->
      <div class="peak-bar" id="peak-bar" role="tablist" aria-label="选择山峰">
        <button class="peak-btn active" data-peak="qingyun" role="tab" aria-selected="true">青云峰</button>
        <button class="peak-btn" data-peak="luoxia" role="tab" aria-selected="false">落霞峰</button>
        <button class="peak-btn" data-peak="hantan" role="tab" aria-selected="false">寒潭峰</button>
      </div>

      <!-- 俯视场景图 -->
      <svg class="peak-map" viewBox="0 0 360 320" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--terrain-1)"/>
            <stop offset="60%" stop-color="var(--terrain-2)"/>
            <stop offset="100%" stop-color="var(--terrain-3)"/>
          </linearGradient>
          <pattern id="pTile" width="18" height="18" patternUnits="userSpaceOnUse">
            <path d="M0 18 L9 9 L18 18" fill="none" stroke="var(--tile-line)" stroke-width="1"/>
          </pattern>
          <pattern id="pSoil" width="8" height="8" patternUnits="userSpaceOnUse">
            <path d="M0 4h8" stroke="var(--soil-line)" stroke-width="1.4" opacity=".7"/>
          </pattern>
          <radialGradient id="gWater" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="var(--water-1)"/>
            <stop offset="100%" stop-color="var(--water-2)"/>
          </radialGradient>
        </defs>

        <!-- 地表 -->
        <rect width="360" height="320" fill="url(#gGround)"/>
        <rect width="360" height="320" fill="url(#pSoil)" opacity=".25"/>

        <!-- 竹篱围墙（四边） -->
        <g class="fence">
          <g stroke="var(--fence)" fill="none" stroke-width="2.2" stroke-linecap="round" opacity=".62">
            <path d="M8 314 L8 24 M352 314 L352 24 M8 24 L352 24"/>
          </g>
          <g fill="var(--fence)" opacity=".72">
            <circle cx="8" cy="24" r="2.4"/><circle cx="352" cy="24" r="2.4"/>
            <circle cx="8" cy="104" r="2.2"/><circle cx="352" cy="104" r="2.2"/>
            <circle cx="8" cy="184" r="2.2"/><circle cx="352" cy="184" r="2.2"/>
            <circle cx="8" cy="264" r="2.2"/><circle cx="352" cy="264" r="2.2"/>
            <circle cx="86" cy="24" r="2"/><circle cx="164" cy="24" r="2"/>
            <circle cx="242" cy="24" r="2"/><circle cx="320" cy="24" r="2"/>
          </g>
        </g>

        <!-- 石径：从门前通到下方 -->
        <path class="path" d="M180 200 C176 214 168 226 160 240 C154 258 152 274 150 292"
              fill="none" stroke="var(--path-edge)" stroke-width="17" stroke-linecap="round" opacity=".55"/>
        <path d="M180 200 C176 214 168 226 160 240 C154 258 152 274 150 292"
              fill="none" stroke="var(--path-fill)" stroke-width="13" stroke-linecap="round" opacity=".85" stroke-dasharray="7 6"/>

        <!-- 灵池 -->
        <g class="pond">
          <ellipse cx="62" cy="250" rx="45" ry="29" fill="var(--rock)" opacity=".55"/>
          <ellipse cx="62" cy="250" rx="41" ry="26" fill="url(#gWater)"/>
          <ellipse cx="62" cy="250" rx="41" ry="26" fill="none" stroke="var(--water-edge)" stroke-width="1.4" opacity=".55"/>
          <path d="M36 244 q7 -4 14 0 M56 254 q7 -4 14 0 M42 259 q6 -3 12 0 M66 246 q6 -3 12 0"
                fill="none" stroke="var(--water-edge)" stroke-width="1.2" opacity=".5"/>
          <!-- 芦苇 -->
          <g stroke="var(--tree-edge)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".75">
            <path d="M24 234 q-2 -10 1 -16"/><path d="M29 236 q1 -9 -1 -15"/>
            <path d="M96 262 q2 -9 -1 -15"/><path d="M101 260 q-1 -8 2 -14"/>
          </g>
        </g>

        <!-- 灵田土畦 -->
        <g class="soil-patch">
          <rect x="196" y="216" width="118" height="74" rx="8"
                fill="var(--soil)" stroke="var(--soil-edge)" stroke-width="1.6"/>
          <path d="M204 232h102 M204 248h102 M204 264h102" stroke="var(--soil-line)" stroke-width="2" opacity=".55"/>
        </g>

        <!-- 洞府：抬梁式 · 须弥座 · 斗拱 · 瓦垄 -->
        <g class="house">
          <!-- 落影 -->
          <ellipse cx="180" cy="208" rx="100" ry="12" fill="rgba(28,24,16,.16)"/>
          <ellipse cx="180" cy="206" rx="76" ry="8" fill="rgba(28,24,16,.10)"/>

          <!-- ===== 台基：须弥座（上枋 / 束腰 / 下枋） ===== -->
          <path d="M100 152 h160 v5 h-160 Z" fill="var(--stone-1)"/>
          <path d="M100 157 h160 v1.6 h-160 Z" fill="rgba(0,0,0,.16)"/>
          <path d="M106 158.6 h148 v10.8 h-148 Z" fill="var(--stone-2)"/>
          <!-- 束腰壸门 -->
          <g fill="rgba(0,0,0,.14)">
            <rect x="116" y="161" width="10" height="6" rx="1.5"/>
            <rect x="140" y="161" width="10" height="6" rx="1.5"/>
            <rect x="164" y="161" width="10" height="6" rx="1.5"/>
            <rect x="186" y="161" width="10" height="6" rx="1.5"/>
            <rect x="210" y="161" width="10" height="6" rx="1.5"/>
            <rect x="234" y="161" width="10" height="6" rx="1.5"/>
          </g>
          <path d="M96 169.4 h168 v12 h-168 Z" fill="var(--stone-1)"/>
          <path d="M96 181.4 h168 v3 h-168 Z" fill="rgba(0,0,0,.22)"/>
          <!-- 台基石面高光 -->
          <path d="M96 169.4 h168 v1.4 h-168 Z" fill="rgba(255,255,255,.35)"/>

          <!-- ===== 石阶（三级 + 垂带） ===== -->
          <g>
            <!-- 三级踏跺（踏面亮、踢面暗） -->
            <rect x="164" y="184" width="32" height="4.6" fill="var(--stone-1)"/>
            <rect x="164" y="188.6" width="32" height="2.2" fill="rgba(0,0,0,.16)"/>
            <rect x="158" y="190.8" width="44" height="4.6" fill="var(--stone-1)"/>
            <rect x="158" y="195.4" width="44" height="2.2" fill="rgba(0,0,0,.16)"/>
            <rect x="151" y="197.6" width="58" height="4.6" fill="var(--stone-1)"/>
            <rect x="151" y="202.2" width="58" height="2.4" fill="rgba(0,0,0,.20)"/>
            <!-- 垂带（两侧斜边） -->
            <path d="M164 184 L151 197.6 L151 204.6 L164 190.8 Z" fill="var(--stone-2)"/>
            <path d="M196 184 L209 197.6 L209 204.6 L196 190.8 Z" fill="var(--stone-2)"/>
            <path d="M164 184 L151 197.6" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
            <path d="M196 184 L209 197.6" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
          </g>

          <!-- ===== 墙身 ===== -->
          <rect x="112" y="98" width="136" height="54" fill="var(--plaster)"/>
          <rect x="112" y="98" width="136" height="5" fill="rgba(0,0,0,.18)"/>
          <rect x="112" y="146" width="136" height="6" fill="rgba(0,0,0,.10)"/>
          <rect x="112" y="98" width="2" height="54" fill="rgba(0,0,0,.08)"/>
          <rect x="246" y="98" width="2" height="54" fill="rgba(0,0,0,.12)"/>

          <!-- ===== 直棂窗 ×2 ===== -->
          <g>
            <rect x="121" y="112" width="36" height="26" rx="1" fill="var(--wood-2)"/>
            <rect x="123.5" y="114.5" width="31" height="21" fill="var(--window-bg)"/>
            <g stroke="var(--wood-2)" stroke-width="1.5">
              <path d="M129 114.5v21M135 114.5v21M141 114.5v21M147 114.5v21"/>
            </g>
            <rect x="203" y="112" width="36" height="26" rx="1" fill="var(--wood-2)"/>
            <rect x="205.5" y="114.5" width="31" height="21" fill="var(--window-bg)"/>
            <g stroke="var(--wood-2)" stroke-width="1.5">
              <path d="M211 114.5v21M217 114.5v21M223 114.5v21M229 114.5v21"/>
            </g>
          </g>

          <!-- ===== 板门（门槛 / 门扇 / 门簪 / 铺首） ===== -->
          <g>
            <rect x="168" y="104" width="24" height="48" fill="var(--wood-1)"/>
            <rect x="168" y="104" width="24" height="48" fill="none" stroke="var(--wood-3)" stroke-width="1.4"/>
            <path d="M180 104v48" stroke="var(--wood-3)" stroke-width="1.2"/>
            <rect x="166" y="102" width="28" height="3.2" rx="1" fill="var(--wood-3)"/>
            <rect x="164" y="148" width="32" height="4" fill="var(--stone-2)"/>
            <!-- 门簪 -->
            <circle cx="174" cy="107" r="1.5" fill="#C9A24A"/>
            <circle cx="186" cy="107" r="1.5" fill="#C9A24A"/>
            <!-- 铺首 -->
            <circle cx="176" cy="130" r="1.8" fill="none" stroke="#C9A24A" stroke-width="1.2"/>
            <circle cx="184" cy="130" r="1.8" fill="none" stroke="#C9A24A" stroke-width="1.2"/>
          </g>

          <!-- ===== 檐柱 ×4（带柱础） ===== -->
          <g>

  <!-- ===== 离线收益 ===== -->
  <div class="modal-overlay" id="offline-overlay" hidden>
    <div class="modal modal-offline">
      <div class="modal-header">闭关归来</div>
      <div class="modal-body" id="offline-body">
        <p class="offline-lead">你离开了 <b id="offline-time">0</b> 分钟</p>
        <div class="offline-gains" id="offline-gains"></div>
      </div>
      <button class="btn-action modal-close" id="offline-close">收入囊中</button>
    </div>
  </div>

  <!-- ===== 访客 ===== -->
  <div class="modal-overlay" id="visitor-overlay" hidden>
    <div class="modal modal-visitor">
      <div class="modal-header" id="visitor-title">访客到访</div>
      <div class="modal-body">
        <div class="visitor-info">
          <span class="visitor-icon" id="visitor-icon">🧙</span>
          <div class="visitor-meta">
            <div class="visitor-name" id="visitor-name">云游道人</div>
            <div class="visitor-greeting" id="visitor-greeting"></div>
          </div>
        </div>
        <div class="visitor-options" id="visitor-options"></div>
        <div class="visitor-response" id="visitor-response" hidden></div>
      </div>
      <button class="btn-action btn-ghost modal-close" id="visitor-dismiss">送客</button>
    </div>
  </div>

  <!-- 通知 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 突破特效 -->
  <div class="breakthrough-fx" id="breakthrough-fx" hidden>
    <div class="fx-ring"></div>
    <div class="fx-light"></div>
    <div class="fx-text">境界突破</div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/save.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/features.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
